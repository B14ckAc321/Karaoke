services:
  backend:
    build:
      context: ./backend
    container_name: karaoke-backend
    ports:
      - "8082:8080"
    environment:
      - NODE_ENV=production
      - DATA_DIR=/data
    volumes:
      - karaoke_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 2s
      retries: 5
    networks:
      - karaoke-network

  frontend:
    build:
      context: ./karaoke
    container_name: karaoke-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - karaoke-network

networks:
  karaoke-network:
    driver: bridge
volumes:
  karaoke_data:

